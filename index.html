<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C语言在线编译器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>C语言在线编译器</h1>
        <p>编写、编译、运行你的C代码</p>
    </header>

    <main class="container">
        <div class="editor-section">
            <div class="editor-header">
                <span>源代码编辑器</span>
                <div class="actions">
                    <button id="runBtn" class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        编译运行
                    </button>
                    <button id="clearBtn" class="btn btn-secondary">清空</button>
                </div>
            </div>
            <textarea id="codeEditor"></textarea>
        </div>

        <div class="output-section">
            <div class="output-header">
                <span>输出结果</span>
                <span id="statusBadge" class="status-badge hidden"></span>
            </div>
            <pre id="output" class="output-content"><span class="placeholder">点击"编译运行"查看结果...</span></pre>
        </div>

        <div class="stdin-section">
            <div class="stdin-header">
                <span>标准输入 (stdin)</span>
            </div>
            <textarea id="stdinInput" placeholder="输入程序需要的标准输入..."></textarea>
        </div>
    </main>

    <footer>
        <p>声明主权：番星 | 联系修复：QQ 3509412293</p>
        <p>基于 Judge0 API | 托管于 EdgeOne Pages</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
