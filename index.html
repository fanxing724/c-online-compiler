<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番星C语言编译器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-hint">手机端建议横屏使用，竖屏也可以编辑和运行</div>
    
    <header>
        <h1>番星C语言编译器</h1>
        <p>编写、编译、运行你的C代码（仅限教学使用）</p>
    </header>

    <main class="container">
        <div class="editor-section">
            <div class="editor-header">
                <span>源代码编辑器</span>
                <div class="actions">
                    <button id="runBtn" class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <span id="runBtnLabel">编译运行</span>
                    </button>
                    <button id="downloadBtn" class="btn btn-secondary" title="下载代码 (Ctrl+S)">下载</button>
                    <button id="resetBtn" class="btn btn-secondary" title="恢复默认模板">重置</button>
                    <button id="clearBtn" class="btn btn-secondary">清空</button>
                </div>
            </div>
            <textarea id="codeEditor">#include &lt;stdio.h&gt;&#10;&#10;int main() {&#10;    puts("Hello, World!");&#10;    return 0;&#10;}</textarea>
        </div>

        <div class="output-section">
            <div class="output-header">
                <span>输出结果</span>
                <span id="statusBadge" class="status-badge hidden"></span>
            </div>
            <pre id="output" class="output-content"><span class="placeholder">点击"编译运行"查看结果...</span></pre>
        </div>

        <div class="stdin-section">
            <div class="stdin-header">
                <span>标准输入 (stdin)</span>
            </div>
            <textarea id="stdinInput" placeholder="输入程序需要的标准输入..."></textarea>
        </div>
    </main>

    <footer>
        <p class="footer-highlight">番星C语言编译器 · 仅限教学使用</p>
        <p>基于 Judge0 API | 托管于 EdgeOne Makers | <span id="appVersion">version loading</span></p>
        <p id="deployStatus" class="backend-status">部署检测中...</p>
        <p id="backendStatus" class="backend-status">后端检测中...</p>
    </footer>

    <script>
        window.__APP_CONFIG__ = {
            version: 'v2026.07.09-edgeone',
            judge0ApiUrl: 'https://ce.judge0.com',
            edgeApiUrl: '/api',
            judge0ProxyUrl: '/proxy',
            useProxy: true,
            backendRunUrl: ''
        };
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
